<!doctype html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=.85">
	<link rel="stylesheet" href="main.css">
	<link rel="stylesheet" href="blu_cel.css">
	<title>Justin Watkins | Blue Cel</title>
</head>

<body>
	
	<div id="control">
		<a class="con" id="upload">
			<img src="Images/upload.png" alt="">
		</a>
		<a class="con" id="gallery">
			<img src="Images/gallery.png" alt="">
		</a>
		<a class="con" id="storyboards">
			<img src="Images/story.png" alt="">
		</a>
	</div>
	
	<div class="sec" id="up">
		<div class="empty_con" id="up_con">
			<p class="empty_img">+</p>
			<p class="empty_text">Stories start here - Upload Images</p>
		</div>
		<div class="empty_con" id="stat_con">
			<div class="count" id="img_count">
				<p class="lab" id="img_num">0</p>
				<p class="lab" id="img_lab">Uploads</p>
			</div>
			<div class="count" id="story_count">
				<p class="lab" id="story_num">0</p>
				<p class="lab" id="story_lab">Storyboards</p>
			</div>
		</div>
	</div>
	
	<div class="sec" id="gal">
		<button id="upload_img">+</button>
		<p id="no_gallery">NOTHING TO SEE HERE</p>
	</div>
	
	<div class="sec" id="stry">
		<div class="empty_con" id="story_con">
			<p id="story_img">+</p>
			<p class="empty_text">Create a new storyboard</p>
		</div>
		<div id="default">
			<a class="def" id="def_aoe">
				<img src="storyboards/Ash of Endhal/Ash of Endhal-Ad Cover.png" alt="">
				<p>Ash of Endhal</p>
			</a>
			<a class="def" id="def_oxy">
				<img src="storyboards/Oxyvoris/Oxyvoris_Cover.jpg" alt="">
				<p>Oxyvoris</p>
			</a>
			<a class="def" id="def_chaos">
				<img src="storyboards/CC - ASoM/classified.png" alt="">
				<p>Chaos Circuit</p>
			</a>
		</div>
		<div id="display">
			<p id="no_story">NO TALES TO TELL</p>
		</div>
	</div>
	
	<script src="main.js"></script>
	<script src="blu_cel.js"></script>
	<script src="storyboards.js"></script>
</body>
</html>
